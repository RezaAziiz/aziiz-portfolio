<svg viewBox="-4 -4 32 32" width="150" height="150" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* 1. Pengaturan Dasar Lapisan Frame */
    .state { 
      opacity: 0; 
      animation-duration: 6s; 
      animation-iteration-count: infinite; 
    }

    #frame-depan  { animation-name: show-front; }
    #frame-samping { animation-name: show-side; }
    #frame-laptop  { animation-name: show-laptop; }

    /* 2. Skenario Cerita (Transisi Instan di Udara) */
    @keyframes show-front {
      0%, 19.99% { opacity: 1; }
      20%, 84.99% { opacity: 0; }
      85%, 100% { opacity: 1; } 
    }
    @keyframes show-side {
      0%, 19.99% { opacity: 0; }
      20%, 24.99% { opacity: 1; }  
      25%, 44.99% { opacity: 0; }
      45%, 84.99% { opacity: 1; }  
      85%, 100% { opacity: 0; }
    }
    @keyframes show-laptop {
      0%, 24.99% { opacity: 0; }
      25%, 44.99% { opacity: 1; }  
      45%, 100% { opacity: 0; }
    }

    /* 3. Animasi Pergerakan Melompat (Bouncing dengan efek gravitasi) */
    #gerak-utama { animation: gerak 6s infinite; }
    @keyframes gerak {
      0%, 15% { transform: translate(0px, 0px); animation-timing-function: ease-out; }
      20%     { transform: translate(-2px, -3px); animation-timing-function: ease-in; }  
      25%, 45% { transform: translate(-4px, 0px); animation-timing-function: ease-out; } 
      52%     { transform: translate(0px, -3px); animation-timing-function: ease-in; }   
      60%, 80% { transform: translate(4px, 0px); animation-timing-function: ease-out; }  
      85%     { transform: translate(2px, -3px); animation-timing-function: ease-in; }   
      90%, 100% { transform: translate(0px, 0px); } 
    }

    /* Membalikkan badan tepat di puncak lompatan tertinggi */
    #arah-samping {
      transform-origin: 12px 12px;
      animation: flip-arah 6s infinite;
    }
    @keyframes flip-arah {
      0%, 51.99% { transform: scaleX(1); }
      52%, 100% { transform: scaleX(-1); }
    }

    /* 4. Mikro-Animasi: Mata Kedip */
    .mata-buka { animation: blink 3s infinite; }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      45.1%, 50% { opacity: 0; }
      50.1%, 100% { opacity: 1; }
    }

    /* 5. Mikro-Animasi: Tangan Mengetik Bergantian  */
    .tangan-kiri {
      animation: ngetik 0.2s infinite;
    }
    .tangan-kanan {
      animation: ngetik 0.2s infinite 0.1s; /* Diberi delay agar mengetik bergantian */
    }
    @keyframes ngetik {
      0%, 49.99% { transform: translateY(0); }
      50%, 100% { transform: translateY(2px); } /* Bergerak 2 pixel ke bawah memencet keyboard */
    }
  </style>

  <!-- Grup Utama Pembungkus untuk Efek Melompat -->
  <g id="gerak-utama">

    <!-- FRAME 1: Menghadap Depan -->
    <g id="frame-depan" class="state">
      <path d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" fill="#D97757" />
    </g>

    <!-- FRAME 2: Winking / Mengedip -->
    <g id="frame-samping" class="state">
      <g id="arah-samping">
        <!-- Badan & Tangan Idle (Menggantung di sisi) -->
        <rect x="5" y="5" width="14" height="11" fill="#D97757" />
        <rect x="2" y="8" width="3" height="4" fill="#D97757" />
        <rect x="19" y="11" width="3" height="4" fill="#D97757" />
        <!-- Kaki Berdiri -->
        <rect x="5" y="16" width="2" height="4" fill="#D97757" />
        <rect x="9" y="16" width="2" height="4" fill="#D97757" />
        <rect x="13" y="16" width="2" height="4" fill="#D97757" />
        <rect x="17" y="16" width="2" height="4" fill="#D97757" />
        <!-- Mata Kedip (Garis) -->
        <rect x="7" y="10" width="3" height="1" fill="#000" />
        <!-- Mata Terbuka (Dianimasikan) -->
        <rect x="14" y="9" width="2" height="2" fill="#000" class="mata-buka" />
      </g>
    </g>

    <!-- FRAME 3: Duduk + Laptop + Mengetik Cepat -->
    <g id="frame-laptop" class="state">
      <!-- Badan Menunduk (Kedua tangan di sisi dihilangkan) -->
      <rect x="4" y="6" width="14" height="11" fill="#D97757" />
      
      <!-- Kaki Ditekuk (Jongkok) -->
      <rect x="4" y="17" width="2" height="2" fill="#D97757" />
      <rect x="5" y="19" width="2" height="2" fill="#D97757" />
      <rect x="8" y="17" width="2" height="2" fill="#D97757" />
      <rect x="9" y="19" width="2" height="2" fill="#D97757" />
      <rect x="12" y="17" width="2" height="2" fill="#D97757" />
      <rect x="13" y="19" width="2" height="2" fill="#D97757" />
      <rect x="16" y="17" width="2" height="2" fill="#D97757" />
      <rect x="17" y="19" width="2" height="2" fill="#D97757" />
      
      <!-- Mata -->
      <rect x="6" y="9" width="2" height="2" fill="#000" />
      <rect x="13" y="9" width="2" height="2" fill="#000" />
      
      <!-- Keyboard Laptop -->
      <rect x="18" y="20" width="6" height="1" fill="#888" />
      <!-- Layar Laptop (Gaya Pixel) -->
      <rect x="22" y="18" width="1" height="2" fill="#888" />
      <rect x="23" y="16" width="1" height="2" fill="#888" />
      <rect x="24" y="14" width="1" height="2" fill="#888" />
      
      <!-- Tangan KIRI menjulur dan mengetik di laptop -->
      <g class="tangan-kiri">
        <rect x="15" y="16" width="3" height="2" fill="#D97757" />
        <rect x="18" y="18" width="2" height="2" fill="#D97757" />
      </g>
      
      <!-- Tangan KANAN menjulur dan mengetik di laptop -->
      <g class="tangan-kanan">
        <rect x="19" y="15" width="2" height="3" fill="#D97757" />
        <rect x="21" y="18" width="2" height="2" fill="#D97757" />
      </g>
    </g>

  </g>
</svg>
