<svg viewBox="0 0 100 100" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .batang-claude {
      stroke: #D97757;
      stroke-width: 6;
      stroke-linecap: round;
      transform-origin: 50px 50px;
      animation: ripple 2.4s ease-in-out infinite;
    }

    /* Gerakan cuma terjadi di 0%-50% (durasi aktif),
       lalu diam dari 50%-100% (jeda sebelum ulang) */
    @keyframes ripple {
      0%   { transform: scale(1); }
      25%  { transform: scale(1.5); }
      50%  { transform: scale(1); }
	  75%  { transform: scale(1); }
      100% { transform: scale(2); } /* diam sampai siklus berakhir */
    }

    g:nth-child(1) .batang-claude { animation-delay: 0.0s; }
    g:nth-child(2) .batang-claude { animation-delay: 0.1s; }
    g:nth-child(3) .batang-claude { animation-delay: 0.2s; }
    g:nth-child(4) .batang-claude { animation-delay: 0.3s; }
    g:nth-child(5) .batang-claude { animation-delay: 0.4s; }
    g:nth-child(6) .batang-claude { animation-delay: 0.5s; }
    g:nth-child(7) .batang-claude { animation-delay: 0.6s; }
    g:nth-child(8) .batang-claude { animation-delay: 0.7s; }
    g:nth-child(9) .batang-claude { animation-delay: 0.8s; }
    g:nth-child(10) .batang-claude { animation-delay: 0.9s; }
    g:nth-child(11) .batang-claude { animation-delay: 1.0s; }
    g:nth-child(12) .batang-claude { animation-delay: 1.1s; }
  </style>

  <g transform="rotate(0 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
  <g transform="rotate(30 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
  <g transform="rotate(60 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
  <g transform="rotate(90 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
  <g transform="rotate(120 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
  <g transform="rotate(150 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
  <g transform="rotate(180 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
  <g transform="rotate(210 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
  <g transform="rotate(240 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
  <g transform="rotate(270 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
  <g transform="rotate(300 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
  <g transform="rotate(330 50 50)"><line x1="50" y1="50" x2="50" y2="20" class="batang-claude" /></g>
</svg>
